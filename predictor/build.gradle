plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.predictor'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion "29.0.13846066"

    defaultConfig {
        applicationId "com.predictor"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // CRITICAL FIX: Forces the build system to only packaging the 64-bit architecture
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // EXPLICIT SOURCE SET MAPPING: Declares your custom jniLibs path
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Optional: optimization flags can go here
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lintOptions {
        abortOnError false
    }

    // PACKAGING SETTINGS: Avoid conflicts with custom named system libraries
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "CarromPredictor_${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation project(':Bcore')
}
